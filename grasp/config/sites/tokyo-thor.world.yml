# 東京の台車（Thor・左フォロワー）で、cuRobo に入れる左腕の周りの物（grasp/curobo/model.py の load_world が読む）。
# 2026-11-21 Sota（Claude Code）。北九州の kitakyushu-collect.world.yml と同じ書き方。
# 座標は腕の付け根（URDF の world・plan.py の base と同じ）[m]。pose は [x, y, z, qw, qx, qy, qz]（wxyz）。
# 床の板は GRASP_FLOOR_Z を上の面にした箱で自動で足す。腕・指・手の本体は cuRobo の球で入っているので、ここは物そのものの大きさ。

table: true

mesh:
  # 本体のフレーム（OpenArm 純正の本体の形）。東京の台車も同じ本体に左右の腕が付いている前提
  body:
    file: grasp/curobo/meshes/body_link0_symp.stl
    scale: 0.001
    pose: [0, 0, 0, 1, 0, 0, 0]
    ignore_links: [openarm_left_link0]

cuboid:
  # 胸のカメラ（D435i・幅 100 × 25 × 25 mm）。位置と向きは 20:32 のハンドアイ（T_base_cam.json・床から約 0.70 m・下向き 46°）、
  # 中心は光学原点からカメラの向きに 12.5 mm 後ろ。マウントの金具の形はまだ入れていない
  chest_camera:
    # 2026-11-22 夜: 北九州と同じマウントへ付け替えた（床から 0.58 m・真下から 19° 前向き・画像の上がロボット側）。
    # 21:2x のハンドアイ（T_base_cam.json）の位置。マウントの金具の形が無いので、
    # カメラ（100 × 25 × 25 mm）より大きく、後ろへ広げた箱にしている。前の値（真下向き 0.81 m）は
    # dims [0.10, 0.025, 0.025] pose [0.159, -0.0399, 1.0944, -0.012, 0.7305, 0.6826, 0.0186]
    dims: [0.14, 0.06, 0.09]
    pose: [0.043, -0.0326, 0.8788, 0.1426, 0.7001, 0.6895, 0.1191]  # 21:2x hand-eye (T_base_cam.json); box 4 cm larger than the camera for the mount
  # 胸のカメラの柱を留める黒い C 形クランプ（2026-11-21 22:01 に左手が掴みに行く途中で当たった）。
  # 宮嶋: 腕の付け根から高さ約 15 cm・幅 3 cm。22:11 に宮嶋が左腕を手で持ち、手首の D405 で撮った深度（wrist_survey_20261121_221112）
  # から、黒い画素の塊で x 0.075〜0.155・y -0.007〜0.023・z 0.43〜0.51（腕の付け根の座標）。
  # 22:01 と 21:54 の動きを cuRobo で照らすと、掴みに行く区間（open gripper→pregrasp）で 3 mm まで近づき、戻りで 40 mm めり込む → 当たった事実と合う。
  # 前後左右と上下に 5〜10 mm の余裕を足した箱
  camera_clamp:
    dims: [0.095, 0.045, 0.095]
    pose: [0.115, 0.008, 0.47, 1, 0, 0, 0]
  # 右腕（home_right_cart-sym-v4 で保持しているとき）。左腕で掴む間は右腕を home に止めておく前提の、腕を囲む箱
  # （FK: 肘 -0.18,-0.18,0.57・手首 0.03,-0.17,0.51・肩 0,-0.15,0.70 から 4 cm 広げた）
  # 2026-11-22: home を 15 cm 後ろへ移した（home_right_cart-sym-v5.yaml）。arm_collision の点から 3 cm 広げた箱。前は dims [0.30, 0.12, 0.34] pose [-0.075, -0.17, 0.58]
  right_arm_home:
    dims: [0.395, 0.188, 0.368]
    pose: [-0.09, -0.158, 0.593, 1, 0, 0, 0]

# arm_collision.py だけが使う物（cuRobo には入れない。初期姿勢が板の 1 cm 上にあり、cuRobo の余裕では初期姿勢から出られないため。
# arm_collision は区間の端より近づかない条件で確かめる）
cuboid_extra:
  # 台車の上の板（2026-11-22 14:45、真下向きの胸カメラの深さから: 板の上面は床から 0.12〜0.15 m、前の縁は腕の付け根から
  # x 0.155 m、幅 y ±0.25 m）。宮嶋: 「モーターが台車に擦れまくった」（release_arm で休みの姿勢へ下ろしたとき）。
  # 後ろ側はカメラに写らないので x −0.25 m までとした。床（z 0.28）から上面（z 0.42・高さの分布の山 0.12〜0.14 m）まで
  cart_tray:
    dims: [0.405, 0.50, 0.14]
    pose: [-0.0475, 0.0, 0.35, 1, 0, 0, 0]
